site_name: Renesas RA8P1 AI 应用开发指南
site_description: 基于 Ethos-U55 NPU 和 TensorFlow Lite Micro 的 RA8P1 端侧 AI 部署指南
site_url: https://renesas-epae-ai-docs.github.io

theme:
  name: material
  language: zh
  features:
    - navigation.expand
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - scheme: default
      primary: blue grey
      accent: cyan
    - scheme: slate
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode

