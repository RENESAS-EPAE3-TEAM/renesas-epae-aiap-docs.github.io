site_name: Renesas RA8P1 AI 应用开发指南
site_description: 基于 Ethos-U55 NPU 和 TensorFlow Lite Micro 的 RA8P1 端侧 AI 部署指南
site_url: https://renesas-epae3-team.github.io/renesas-epae-aiap-docs.github.io/
copyright: 文档版本 v1.0.0 | 2026-08-06

theme:
  name: material
  language: zh
  font: false
  features:
    - navigation.expand
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
  palette:
    - scheme: default
      primary: custom
      accent: custom
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - javascripts/mermaid.js

nav:
  - 首页: index.md
  - 1. RA8P1 AI 概述:
    - 平台与软件架构: 01-overview/platform.md
    - 完整开发流程: 01-overview/development-flow.md
  - 2. 快速入门:
    - 开发前置条件: 02-getting-started/prerequisites.md
    - MNIST：运行第一个 AI 示例: 02-getting-started/quick-start.md
  - 3. 模型转换与量化:
    - Keras/ONNX 转换、量化与验证: 03-model-preparation/int8-quantization.md
  - 4. 平台配置:
    - 时钟与内存规划: 04-platform-configuration/clock-and-memory.md
    - 模型存储介质选择: 04-platform-configuration/storage-selection.md
  - 5. NPU 模型部署:
    - NPU 推理流程: 05-npu-deployment/inference-flow.md
  - 6. 自定义算子:
    - 算子支持检查: 06-custom-operators/operator-support.md
    - 自定义算子部署与调试: 06-custom-operators/custom-operator.md
  - 7. 性能调优:
    - 性能调优: 07-optimization/performance.md
  - 8. 参考资料:
    - 源文档与维护说明: 08-reference/source-documents.md
    - 发行说明: 08-reference/release-notes.md
  - RA8P1官网: https://www.renesas.cn/zh/products/ra8p1
  - ONE FILED JIRA: https://onefieldjira.renesas.com/projects/MPU/queues/custom/1256
  - Wiki Page: https://renesas-wiki.atlassian.net/wiki/spaces/REN/overview


